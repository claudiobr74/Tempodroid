name: Build signed AAB versionCode 13

on:
  push:
    branches:
      - release/play-aab-13

permissions:
  contents: read

concurrency:
  group: tempodroid-release-13
  cancel-in-progress: false

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Play versionCode
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(tr -d '[:space:]' < release/play-version-code.txt)"
          requested="13"
          [[ "$baseline" =~ ^[0-9]+$ ]]
          if (( requested <= baseline )); then
            echo "versionCode $requested inválido: deve ser maior que o último emitido ($baseline)." >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Figma visual assets
        run: python3 scripts/verify_figma_visual_assets.py

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TEMPODROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/tempodroid-upload.jks"

      - name: Build signed release bundle
        env:
          TEMPODROID_VERSION_CODE: "13"
          TEMPODROID_VERSION_NAME: "1.0.0"
          TEMPODROID_KEYSTORE_PATH: ${{ runner.temp }}/tempodroid-upload.jks
          TEMPODROID_KEYSTORE_PASSWORD: ${{ secrets.TEMPODROID_KEYSTORE_PASSWORD }}
          TEMPODROID_KEY_ALIAS: ${{ secrets.TEMPODROID_KEY_ALIAS }}
          TEMPODROID_KEY_PASSWORD: ${{ secrets.TEMPODROID_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:test :app:lintRelease :app:bundleRelease --stacktrace --parallel --build-cache

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: Tempodroid-1.0.0-versionCode13
          path: app/build/outputs/bundle/release/app-release.aab
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Preserve production R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-1.0.0-13
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
