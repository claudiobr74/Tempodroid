name: Patch dashboard forecast

on:
  push:
    branches:
      - feature/dashboard-forecast

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/dashboard-forecast
      - name: Patch dashboard UI
        env:
          FORECAST_BLOCK_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('app/src/main/java/com/tempodroid/ui/TempodroidLightControlUi.kt')
          text = path.read_text()
          if 'private fun LightHourlyForecastStrip' in text:
              raise SystemExit(0)
          text = text.replace('import androidx.compose.foundation.rememberScrollState\n', 'import androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.horizontalScroll\n')
          text = text.replace('import com.tempodroid.weather.WeatherCodeMapper\n', 'import com.tempodroid.weather.DailyForecast\nimport com.tempodroid.weather.ForecastSnapshot\nimport com.tempodroid.weather.HourlyForecast\nimport com.tempodroid.weather.WeatherCodeMapper\n')
          text = text.replace('import java.time.LocalTime\n', 'import java.time.LocalDate\nimport java.time.LocalTime\nimport java.time.ZoneId\n')
          text = text.replace('fun TempodroidLightControlApp(\n    primaryState: SolarWeatherWidgetState,\n    primaryWidgetId: Int?,', 'fun TempodroidLightControlApp(\n    primaryState: SolarWeatherWidgetState,\n    primaryForecast: ForecastSnapshot,\n    primaryWidgetId: Int?,')
          text = text.replace('LightDestination.HOME -> LightDashboardScreen(\n                            state = primaryState,\n                            primaryWidgetId = primaryWidgetId,', 'LightDestination.HOME -> LightDashboardScreen(\n                            state = primaryState,\n                            forecast = primaryForecast,\n                            primaryWidgetId = primaryWidgetId,')
          text = text.replace('private fun LightDashboardScreen(\n    state: SolarWeatherWidgetState,\n    primaryWidgetId: Int?,', 'private fun LightDashboardScreen(\n    state: SolarWeatherWidgetState,\n    forecast: ForecastSnapshot,\n    primaryWidgetId: Int?,')
          text = text.replace('        LightWeatherCard(state)\n', '        LightWeatherCard(state, forecast)\n')
          start = text.index('@Composable\nprivate fun LightWeatherCard')
          end = text.index('@Composable\nprivate fun LightSolarLunarCard', start)
          replacement = base64.b64decode(os.environ['FORECAST_BLOCK_B64']).decode('utf-8')
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit patched UI
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tempodroid/ui/TempodroidLightControlUi.kt
          git commit -m "Integra previsão horária e de 5 dias no dashboard"
          git push origin HEAD:feature/dashboard-forecast
