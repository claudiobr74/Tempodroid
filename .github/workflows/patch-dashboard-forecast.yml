name: Patch dashboard forecast

on:
  push:
    branches:
      - feature/dashboard-forecast

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/dashboard-forecast
      - name: Patch dashboard UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/tempodroid/ui/TempodroidLightControlUi.kt')
          text = path.read_text()
          if 'private fun LightHourlyForecastStrip' in text:
              raise SystemExit(0)

          text = text.replace(
              'import androidx.compose.foundation.rememberScrollState\n',
              'import androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.horizontalScroll\n',
          )
          text = text.replace(
              'import com.tempodroid.weather.WeatherCodeMapper\n',
              'import com.tempodroid.weather.DailyForecast\nimport com.tempodroid.weather.ForecastSnapshot\nimport com.tempodroid.weather.HourlyForecast\nimport com.tempodroid.weather.WeatherCodeMapper\n',
          )
          text = text.replace(
              'import java.time.LocalTime\n',
              'import java.time.LocalDate\nimport java.time.LocalTime\nimport java.time.ZoneId\n',
          )
          text = text.replace(
              'fun TempodroidLightControlApp(\n    primaryState: SolarWeatherWidgetState,\n    primaryWidgetId: Int?,',
              'fun TempodroidLightControlApp(\n    primaryState: SolarWeatherWidgetState,\n    primaryForecast: ForecastSnapshot,\n    primaryWidgetId: Int?,',
          )
          text = text.replace(
              'LightDestination.HOME -> LightDashboardScreen(\n                            state = primaryState,\n                            primaryWidgetId = primaryWidgetId,',
              'LightDestination.HOME -> LightDashboardScreen(\n                            state = primaryState,\n                            forecast = primaryForecast,\n                            primaryWidgetId = primaryWidgetId,',
          )
          text = text.replace(
              'private fun LightDashboardScreen(\n    state: SolarWeatherWidgetState,\n    primaryWidgetId: Int?,',
              'private fun LightDashboardScreen(\n    state: SolarWeatherWidgetState,\n    forecast: ForecastSnapshot,\n    primaryWidgetId: Int?,',
          )
          text = text.replace('        LightWeatherCard(state)\n', '        LightWeatherCard(state, forecast)\n')

          start = text.index('@Composable\nprivate fun LightWeatherCard')
          end = text.index('@Composable\nprivate fun LightSolarLunarCard', start)
          replacement = r'''@Composable
private fun LightWeatherCard(state: SolarWeatherWidgetState, forecast: ForecastSnapshot) {
    val zone = runCatching { ZoneId.of(state.timezoneId) }.getOrDefault(ZoneId.systemDefault())
    val now = Instant.now().atZone(zone)
    val today = now.toLocalDate()
    val hourly = forecast.hourly
        .filter { item ->
            val local = item.time.atZone(zone)
            local.toLocalDate() == today && !item.time.isBefore(now.toInstant())
        }
    val nextDays = forecast.daily.filter { it.date.isAfter(today) }.take(5)

    Column(
        modifier = Modifier
            .fillMaxWidth()
            .background(LightSurface, RoundedCornerShape(20.dp))
            .border(1.dp, LightBorder, RoundedCornerShape(20.dp))
            .padding(16.dp),
        verticalArrangement = Arrangement.spacedBy(14.dp),
    ) {
        Row(
            modifier = Modifier.fillMaxWidth(),
            verticalAlignment = Alignment.CenterVertically,
            horizontalArrangement = Arrangement.SpaceBetween,
        ) {
            Column {
                Text("${state.temperature ?: "--"}°", fontSize = 38.sp, fontWeight = FontWeight.Bold, color = LightText)
                Text(
                    "Sensação ${state.apparentTemperature?.let { "$it°" } ?: "--"}",
                    color = LightTextSecondary,
                    fontSize = 13.sp,
                )
            }
            Column(
                modifier = Modifier
                    .background(LightActive, RoundedCornerShape(14.dp))
                    .padding(horizontal = 14.dp, vertical = 12.dp),
                horizontalAlignment = Alignment.End,
            ) {
                Text(
                    WeatherCodeMapper.labelPt(state.condition, state.isDay),
                    color = LightAccentStrong,
                    fontSize = 15.sp,
                    fontWeight = FontWeight.SemiBold,
                    textAlign = TextAlign.End,
                )
                Text(state.city, color = LightTextSecondary, fontSize = 12.sp)
            }
        }

        Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxWidth()) {
            LightDetailCell(Icons.Outlined.Air, "Vento", state.windSpeedKmh?.let { "$it km/h" } ?: "--", Modifier.weight(1f))
            LightDetailCell(Icons.Outlined.Cloud, "Chuva", state.rainChance?.let { "$it%" } ?: "--", Modifier.weight(1f))
        }

        if (hourly.isNotEmpty()) {
            LightHourlyForecastStrip(hourly, state, zone)
        }
        if (nextDays.isNotEmpty()) {
            LightFiveDayForecast(nextDays)
        }
        if (hourly.isEmpty() && nextDays.isEmpty()) {
            Text(
                "A previsão detalhada aparecerá após a próxima atualização do clima.",
                color = LightTextSecondary,
                fontSize = 12.sp,
            )
        }
    }
}

@Composable
private fun LightDetailCell(icon: ImageVector, label: String, value: String, modifier: Modifier) {
    Row(
        modifier = modifier
            .background(LightSurfaceAlt, RoundedCornerShape(12.dp))
            .padding(horizontal = 12.dp, vertical = 10.dp),
        verticalAlignment = Alignment.CenterVertically,
    ) {
        Icon(icon, null, tint = LightAccent, modifier = Modifier.size(18.dp))
        Spacer(Modifier.width(9.dp))
        Column {
            Text(label, color = LightTextSecondary, fontSize = 11.sp)
            Text(value, color = LightText, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
        }
    }
}

@Composable
private fun LightHourlyForecastStrip(
    hourly: List<HourlyForecast>,
    state: SolarWeatherWidgetState,
    zone: ZoneId,
) {
    Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
        Text("Hoje · por hora", color = LightText, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
        Row(
            modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
            horizontalArrangement = Arrangement.spacedBy(8.dp),
        ) {
            hourly.forEach { item ->
                val localTime = item.time.atZone(zone).toLocalTime()
                val isDay = lightForecastIsDay(localTime, state)
                Column(
                    modifier = Modifier
                        .width(66.dp)
                        .background(LightSurfaceAlt, RoundedCornerShape(12.dp))
                        .padding(vertical = 9.dp, horizontal = 6.dp),
                    horizontalAlignment = Alignment.CenterHorizontally,
                    verticalArrangement = Arrangement.spacedBy(3.dp),
                ) {
                    Text("${localTime.hour.toString().padStart(2, '0')}h", color = LightTextSecondary, fontSize = 11.sp)
                    Text(lightWeatherGlyph(item.condition, isDay), fontSize = 20.sp)
                    Text(item.temperature?.let { "$it°" } ?: "--", color = LightText, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                    Text(
                        item.rainChance?.let { "💧 $it%" } ?: "💧 --",
                        color = LightAccentStrong,
                        fontSize = 10.sp,
                        maxLines = 1,
                    )
                }
            }
        }
    }
}

@Composable
private fun LightFiveDayForecast(days: List<DailyForecast>) {
    Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
        Text("Próximos 5 dias", color = LightText, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
        days.forEach { day ->
            Row(
                modifier = Modifier
                    .fillMaxWidth()
                    .background(LightSurfaceAlt, RoundedCornerShape(12.dp))
                    .padding(horizontal = 12.dp, vertical = 9.dp),
                verticalAlignment = Alignment.CenterVertically,
            ) {
                Column(Modifier.width(74.dp)) {
                    Text(lightForecastDayLabel(day.date), color = LightText, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                    Text(day.date.format(DateTimeFormatter.ofPattern("dd/MM")), color = LightTextSecondary, fontSize = 10.sp)
                }
                Text(lightWeatherGlyph(day.condition, true), fontSize = 20.sp, modifier = Modifier.width(38.dp))
                Text(
                    "${day.low?.let { "$it°" } ?: "--"}  /  ${day.high?.let { "$it°" } ?: "--"}",
                    color = LightText,
                    fontSize = 12.sp,
                    fontWeight = FontWeight.SemiBold,
                    modifier = Modifier.weight(1f),
                )
                Text(
                    day.rainChance?.let { "💧 $it%" } ?: "💧 --",
                    color = LightAccentStrong,
                    fontSize = 11.sp,
                )
            }
        }
    }
}

private fun lightForecastIsDay(time: LocalTime, state: SolarWeatherWidgetState): Boolean {
    val sunrise = state.sunrise
    val sunset = state.sunset
    return if (sunrise != null && sunset != null) {
        !time.isBefore(sunrise) && time.isBefore(sunset)
    } else {
        time.hour in 6..17
    }
}

private fun lightWeatherGlyph(condition: WeatherCondition, isDay: Boolean): String = when (condition) {
    WeatherCondition.CLEAR -> if (isDay) "☀️" else "🌙"
    WeatherCondition.PARTLY_CLOUDY -> if (isDay) "🌤️" else "☁️"
    WeatherCondition.CLOUDY -> "☁️"
    WeatherCondition.RAIN -> "🌦️"
    WeatherCondition.HEAVY_RAIN -> "🌧️"
    WeatherCondition.SNOW -> "🌨️"
    WeatherCondition.STORM -> "⛈️"
    WeatherCondition.FOG -> "🌫️"
}

private fun lightForecastDayLabel(date: LocalDate): String =
    DateTimeFormatter.ofPattern("EEE", Locale("pt", "BR"))
        .format(date)
        .removeSuffix(".")
        .replaceFirstChar { if (it.isLowerCase()) it.titlecase(Locale("pt", "BR")) else it.toString() }

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Commit patched UI
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tempodroid/ui/TempodroidLightControlUi.kt
          git commit -m "Integra previsão horária e de 5 dias no dashboard"
          git push origin HEAD:feature/dashboard-forecast
