name: Android CI — validação final

on:
  workflow_dispatch:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # No plano GitHub Free, este workflow roda somente uma vez quando o PR
    # sai de draft ou quando for disparado manualmente. Evita gastar minutos
    # a cada commit/synchronize durante o desenvolvimento.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Figma visual assets
        run: python3 scripts/verify_figma_visual_assets.py

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Tests, lint and debug build
        run: ./gradlew :core:test :app:test :app:lintRelease :app:assembleDebug --stacktrace --parallel --build-cache

      - name: Verify Play package
        run: |
          grep -q '"applicationId": "com.tempodroid.myapp"' app/build/outputs/apk/debug/output-metadata.json
