name: Android CI — validação final

on:
  workflow_dispatch:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: read

# POLÍTICA DE CUSTO (GitHub Free / repositório privado)
# - Não executar CI a cada commit/synchronize.
# - Manter o PR como draft durante a implementação.
# - Rodar uma única validação final ao marcar o PR como ready for review.
# - Para repetir uma validação, usar workflow_dispatch conscientemente.
# - APK/AAB e mapping pertencem ao workflow de release manual.

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Figma visual assets
        run: python3 scripts/verify_figma_visual_assets.py

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Tests, lint and debug build
        run: ./gradlew :core:test :app:test :app:lintRelease :app:assembleDebug --stacktrace --parallel --build-cache

      - name: Verify Play package
        run: |
          grep -q '"applicationId": "com.tempodroid.myapp"' app/build/outputs/apk/debug/output-metadata.json
