name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Tests, lint, debug build and release bundle
        run: ./gradlew :core:test :app:test :app:lintRelease :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Verify Play package
        run: grep -q '"applicationId": "com.tempodroid.myapp"' app/build/outputs/apk/debug/output-metadata.json

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tempodroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB validation artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/bundle/release/app-release.aab
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Preserve R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-validation
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
