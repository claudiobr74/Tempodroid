name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Materialize canonical Figma v2 backgrounds
        run: |
          set -euo pipefail
          mkdir -p /tmp/figma-v2
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/605d8d76-18b8-49ae-a667-9e16a0f34bc7.png' -o /tmp/figma-v2/figma_sky_clear_day.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/6eac2700-dbb9-45d7-b34f-970f1e955135.png' -o /tmp/figma-v2/figma_sky_partly_cloudy.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/232e61b9-1fc7-4f5b-baa9-7a1b2467018d.png' -o /tmp/figma-v2/figma_sky_cloudy.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/375f864c-450e-47eb-9555-8cd05adb409d.png' -o /tmp/figma-v2/figma_sky_rain.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/1e157a0b-ab3a-47be-9b51-3db21f232c87.png' -o /tmp/figma-v2/figma_sky_storm.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/7571eda6-62c1-43dd-a647-6d92972d656f.png' -o /tmp/figma-v2/figma_sky_sunrise.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/9b879b14-0fe7-4027-8cdf-bb8fbc13a2ed.png' -o /tmp/figma-v2/figma_sky_sunset.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/4fad58f2-5921-448c-b8e7-d0cbda986db5.png' -o /tmp/figma-v2/figma_sky_clear_night.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/0dd140c5-ff69-4a9e-b81a-c1ffee82cb3f.png' -o /tmp/figma-v2/figma_sky_cloudy_night.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/994c2844-5bc5-4218-b5a1-d060ece09272.png' -o /tmp/figma-v2/figma_sky_rain_night.png
          file /tmp/figma-v2/*
          sha256sum /tmp/figma-v2/*

      - name: Persist canonical Figma v2 backgrounds on PR branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cp /tmp/figma-v2/*.png app/src/main/res/drawable-nodpi/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/figma_sky_*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza backgrounds canônicos do Figma v2'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload canonical Figma v2 backgrounds
        uses: actions/upload-artifact@v7
        with:
          name: figma-v2-raw-backgrounds
          path: /tmp/figma-v2/*.png
          if-no-files-found: error
          retention-days: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Figma visual assets
        run: python3 scripts/verify_figma_visual_assets.py

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Tests, lint, debug build and release bundle
        run: ./gradlew :core:test :app:test :app:lintRelease :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Verify Play package
        run: |
          grep -q '"applicationId": "com.tempodroid.myapp"' app/build/outputs/apk/debug/output-metadata.json

      - name: Upload timeline and moon previews
        uses: actions/upload-artifact@v7
        with:
          name: timeline-moon-previews
          path: app/build/reports/timeline-moon-previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tempodroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB validation artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/bundle/release/app-release.aab
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Preserve R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-validation
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
