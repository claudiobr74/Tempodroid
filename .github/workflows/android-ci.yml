name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Figma visual assets
        run: python3 scripts/verify_figma_visual_assets.py

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Tests, lint and debug build
        run: ./gradlew :core:test :app:test :app:lintRelease :app:assembleDebug --stacktrace

      - name: Release bundle validation on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Verify Play package
        run: |
          grep -q '"applicationId": "com.tempodroid.myapp"' app/build/outputs/apk/debug/output-metadata.json

      - name: Upload timeline and moon previews
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: timeline-moon-previews
          path: app/build/reports/timeline-moon-previews/*.png
          if-no-files-found: error
          retention-days: 1
