name: Import Figma sky assets once

on:
  push:
    branches:
      - upgrade/figma-sky-backgrounds-15
    paths:
      - .github/workflows/figma-sky-import.yml

permissions:
  contents: write

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import exact Figma backgrounds by fingerprint
        shell: bash
        run: |
          set -euo pipefail
          D=app/src/main/res/drawable-nodpi
          T="$(mktemp -d)"
          mkdir -p "$D"
          urls=(
            'https://www.figma.com/api/mcp/asset/4eb8ca42-f717-4d44-926b-53a0f1adedf5'
            'https://www.figma.com/api/mcp/asset/681dcb82-2ab2-4a42-ab15-37100a585be6'
            'https://www.figma.com/api/mcp/asset/f8a7ddee-ff33-4181-8906-d9b73fff36ed'
            'https://www.figma.com/api/mcp/asset/42c6b1af-3ec8-4eb2-b463-98cf533a3b52'
            'https://www.figma.com/api/mcp/asset/42237ffe-a6f3-451a-97ab-abcbaf501299'
            'https://www.figma.com/api/mcp/asset/578d2a0f-fa27-446b-984d-3220bb9edfd7'
            'https://www.figma.com/api/mcp/asset/d2b8ebbf-3c3d-4df2-a39f-795516b48c47'
            'https://www.figma.com/api/mcp/asset/8223d488-4611-435d-9ca9-5061004e57ce'
            'https://www.figma.com/api/mcp/asset/3eb96aed-fbdb-4819-8a9e-f3a57fdf317f'
            'https://www.figma.com/api/mcp/asset/7dbccb37-d179-47b1-8cf1-f8bd3beb37ff'
            'https://www.figma.com/api/mcp/asset/f8537992-9d49-4fc1-a872-5e6ba4aae752'
            'https://www.figma.com/api/mcp/asset/c2583268-adbb-4e79-9103-0b725e56f0c8'
            'https://www.figma.com/api/mcp/asset/23a6fe20-3fda-445f-baae-ad01e7748ed6'
            'https://www.figma.com/api/mcp/asset/b14786a9-87d2-4836-bd87-839de7f74294'
            'https://www.figma.com/api/mcp/asset/80433ad4-88e5-46ae-bfbf-a17f3ad689c6'
          )
          for i in "${!urls[@]}"; do
            src="$T/$i.jpg"
            curl -fLsS --retry 2 --retry-delay 1 "${urls[$i]}" -o "$src"
            size="$(stat -c%s "$src")"
            case "$size" in
              27420) name=figma_sky_day_clear ;;
              58731) name=figma_sky_day_partly_cloudy ;;
              29810) name=figma_sky_day_cloudy ;;
              24779) name=figma_sky_day_rain ;;
              38799) name=figma_sky_day_storm ;;
              27801) name=figma_sky_sunset_clear ;;
              42479) name=figma_sky_sunset_partly_cloudy ;;
              38399) name=figma_sky_sunset_cloudy ;;
              35389) name=figma_sky_sunset_rain ;;
              44823) name=figma_sky_sunset_storm ;;
              38214) name=figma_sky_night_clear ;;
              37337) name=figma_sky_night_partly_cloudy ;;
              23044) name=figma_sky_night_cloudy ;;
              34723) name=figma_sky_night_rain ;;
              34709) name=figma_sky_night_storm ;;
              *) echo "Asset Figma desconhecido: $size bytes"; exit 1 ;;
            esac
            test ! -e "$D/$name.jpg" || { echo "Asset duplicado: $name"; exit 1; }
            mv "$src" "$D/$name.jpg"
            echo "$name <- $size bytes"
          done
          find "$D" -maxdepth 1 -type f -name 'figma_sky_*.png' -delete
          python3 scripts/verify_figma_visual_assets.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Tests, lint and debug build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:test :app:lintDebug :app:assembleDebug --stacktrace --parallel --build-cache

      - name: Commit validated Figma upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/figma-sky-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Importa 15 fundos atualizados do Figma'
          git push origin HEAD:upgrade/figma-sky-backgrounds-15
