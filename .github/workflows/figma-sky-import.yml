name: Import Figma sky assets once

on:
  push:
    branches:
      - upgrade/figma-sky-backgrounds-15
    paths:
      - .github/workflows/figma-sky-import.yml

permissions:
  contents: write

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Import exact Figma backgrounds
        shell: bash
        run: |
          set -euo pipefail
          D=app/src/main/res/drawable-nodpi
          mkdir -p "$D"
          fetch() {
            local name="$1" url="$2" size="$3"
            echo "Importing $name"
            curl -fL --retry 2 --retry-delay 1 "$url" -o "$D/$name.jpg"
            actual="$(stat -c%s "$D/$name.jpg")"
            test "$actual" -eq "$size" || { echo "$name: $actual bytes, expected $size"; exit 1; }
          }
          fetch figma_sky_day_clear 'https://www.figma.com/api/mcp/asset/4eb8ca42-f717-4d44-926b-53a0f1adedf5' 27420
          fetch figma_sky_day_partly_cloudy 'https://www.figma.com/api/mcp/asset/681dcb82-2ab2-4a42-ab15-37100a585be6' 58731
          fetch figma_sky_day_cloudy 'https://www.figma.com/api/mcp/asset/f8a7ddee-ff33-4181-8906-d9b73fff36ed' 29810
          fetch figma_sky_day_rain 'https://www.figma.com/api/mcp/asset/42c6b1af-3ec8-4eb2-b463-98cf533a3b52' 24779
          fetch figma_sky_day_storm 'https://www.figma.com/api/mcp/asset/42237ffe-a6f3-451a-97ab-abcbaf501299' 38799
          fetch figma_sky_sunset_clear 'https://www.figma.com/api/mcp/asset/578d2a0f-fa27-446b-984d-3220bb9edfd7' 27801
          fetch figma_sky_sunset_partly_cloudy 'https://www.figma.com/api/mcp/asset/d2b8ebbf-3c3d-4df2-a39f-795516b48c47' 42479
          fetch figma_sky_sunset_cloudy 'https://www.figma.com/api/mcp/asset/8223d488-4611-435d-9ca9-5061004e57ce' 38399
          fetch figma_sky_sunset_rain 'https://www.figma.com/api/mcp/asset/3eb96aed-fbdb-4819-8a9e-f3a57fdf317f' 35389
          fetch figma_sky_sunset_storm 'https://www.figma.com/api/mcp/asset/7dbccb37-d179-47b1-8cf1-f8bd3beb37ff' 44823
          fetch figma_sky_night_clear 'https://www.figma.com/api/mcp/asset/f8537992-9d49-4fc1-a872-5e6ba4aae752' 38214
          fetch figma_sky_night_partly_cloudy 'https://www.figma.com/api/mcp/asset/c2583268-adbb-4e79-9103-0b725e56f0c8' 37337
          fetch figma_sky_night_cloudy 'https://www.figma.com/api/mcp/asset/23a6fe20-3fda-445f-baae-ad01e7748ed6' 23044
          fetch figma_sky_night_rain 'https://www.figma.com/api/mcp/asset/b14786a9-87d2-4836-bd87-839de7f74294' 34723
          fetch figma_sky_night_storm 'https://www.figma.com/api/mcp/asset/80433ad4-88e5-46ae-bfbf-a17f3ad689c6' 34709
          find "$D" -maxdepth 1 -type f -name 'figma_sky_*.png' -delete
          python3 scripts/verify_figma_visual_assets.py

      - name: Tests, lint and debug build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:test :app:lintDebug :app:assembleDebug --stacktrace --parallel --build-cache

      - name: Commit validated Figma upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/figma-sky-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Importa 15 fundos atualizados do Figma'
          git push origin HEAD:upgrade/figma-sky-backgrounds-15
