name: Import Figma sky assets once

on:
  push:
    branches:
      - upgrade/figma-sky-backgrounds-15
    paths:
      - .github/workflows/figma-sky-import.yml

permissions:
  contents: write

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Import exact Figma backgrounds
        shell: bash
        run: |
          set -euo pipefail
          D=app/src/main/res/drawable-nodpi
          mkdir -p "$D"
          fetch() {
            local name="$1" url="$2" size="$3"
            curl -fsSL --retry 3 --retry-delay 1 "$url" -o "$D/$name.jpg"
            test "$(stat -c%s "$D/$name.jpg")" -eq "$size"
          }
          fetch figma_sky_day_clear 'https://www.figma.com/api/mcp/asset/00829dfd-7192-4b5d-ae66-3292943fe948' 27420
          fetch figma_sky_day_partly_cloudy 'https://www.figma.com/api/mcp/asset/c297558a-c2cb-4d37-beb4-f35cb5e7c977' 58731
          fetch figma_sky_day_cloudy 'https://www.figma.com/api/mcp/asset/3310d01e-6f6c-4f0f-bf0c-2e4eda3b042c' 29810
          fetch figma_sky_day_rain 'https://www.figma.com/api/mcp/asset/184ff205-8502-46c6-938c-9cac14224b1b' 24779
          fetch figma_sky_day_storm 'https://www.figma.com/api/mcp/asset/fb518512-df63-4f50-b5d0-252438d6f9ca' 38799
          fetch figma_sky_sunset_clear 'https://www.figma.com/api/mcp/asset/7d66badd-8ec1-4871-a97d-317183fb7ee7' 27801
          fetch figma_sky_sunset_partly_cloudy 'https://www.figma.com/api/mcp/asset/43faaaf8-cddb-4d4e-840c-41f574b7e124' 42479
          fetch figma_sky_sunset_cloudy 'https://www.figma.com/api/mcp/asset/57af140e-731a-444e-87b3-75f707390b30' 38399
          fetch figma_sky_sunset_rain 'https://www.figma.com/api/mcp/asset/e15745f7-f67c-40ea-a763-a1e6417e81d9' 35389
          fetch figma_sky_sunset_storm 'https://www.figma.com/api/mcp/asset/2cedcccf-adb8-4a63-9cc5-3d33a79ec1a2' 44823
          fetch figma_sky_night_clear 'https://www.figma.com/api/mcp/asset/925daade-5b98-4eec-8162-bb9dfffc08a5' 38214
          fetch figma_sky_night_partly_cloudy 'https://www.figma.com/api/mcp/asset/06b39465-fd16-42dc-8bed-b976b917620b' 37337
          fetch figma_sky_night_cloudy 'https://www.figma.com/api/mcp/asset/4c6e340a-68fb-4b29-80ac-10012655da83' 23044
          fetch figma_sky_night_rain 'https://www.figma.com/api/mcp/asset/00b1b151-2586-4779-8c5e-b6cdf7e13ea2' 34723
          fetch figma_sky_night_storm 'https://www.figma.com/api/mcp/asset/4122cb6a-904a-41f3-8afd-c6918eccbf2f' 34709
          find "$D" -maxdepth 1 -type f -name 'figma_sky_*.png' -delete
          python3 scripts/verify_figma_visual_assets.py

      - name: Tests, lint and debug build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:test :app:lintDebug :app:assembleDebug --stacktrace --parallel --build-cache

      - name: Commit validated Figma upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/figma-sky-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Importa 15 fundos atualizados do Figma'
          git push origin HEAD:upgrade/figma-sky-backgrounds-15
