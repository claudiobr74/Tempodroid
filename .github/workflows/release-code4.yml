name: Build Tempodroid 1.1.0 code 4 signed AAB

on:
  push:
    branches:
      - release/1.1.0-code4

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Figma visual assets
        run: python3 scripts/verify_figma_visual_assets.py

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TEMPODROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/tempodroid-upload.jks"

      - name: Build signed release bundle
        env:
          TEMPODROID_VERSION_CODE: "4"
          TEMPODROID_VERSION_NAME: "1.1.0"
          TEMPODROID_KEYSTORE_PATH: ${{ runner.temp }}/tempodroid-upload.jks
          TEMPODROID_KEYSTORE_PASSWORD: ${{ secrets.TEMPODROID_KEYSTORE_PASSWORD }}
          TEMPODROID_KEY_ALIAS: ${{ secrets.TEMPODROID_KEY_ALIAS }}
          TEMPODROID_KEY_PASSWORD: ${{ secrets.TEMPODROID_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:test :app:lintRelease :app:bundleRelease --stacktrace

      - name: Rename release bundle
        run: cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/tempodroid-1.1.0-4.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: tempodroid-1.1.0-4.aab
          path: app/build/outputs/bundle/release/tempodroid-1.1.0-4.aab
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Preserve production R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-1.1.0-4
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
