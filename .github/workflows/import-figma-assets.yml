name: Import Figma visual assets

on:
  push:
    branches:
      - figma-visual-states
    paths:
      - .github/workflows/import-figma-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: figma-visual-states

      - name: Download original Figma lunar texture
        shell: bash
        run: |
          set -euo pipefail
          out='app/src/main/res/drawable-nodpi'
          mkdir -p "$out"
          curl --fail --location --retry 3 -o "$out/figma_moon_surface.png" 'https://www.figma.com/api/mcp/asset/28009480-1453-4ae7-9a83-406d26d4bf1d'
          file "$out/figma_moon_surface.png"

      - name: Commit imported asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/figma_moon_surface.png
          git diff --cached --quiet && exit 0
          git commit -m 'Importa textura lunar original do Figma [assets]'
          git push origin HEAD:figma-visual-states
