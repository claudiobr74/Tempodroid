name: Build signed Play Store AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode"
        required: true
        default: "1"
      version_name:
        description: "Versão pública (ex.: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Figma visual assets
        run: python3 scripts/verify_figma_visual_assets.py

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TEMPODROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/tempodroid-upload.jks"

      - name: Build signed release bundle
        env:
          TEMPODROID_VERSION_CODE: ${{ inputs.version_code }}
          TEMPODROID_VERSION_NAME: ${{ inputs.version_name }}
          TEMPODROID_KEYSTORE_PATH: ${{ runner.temp }}/tempodroid-upload.jks
          TEMPODROID_KEYSTORE_PASSWORD: ${{ secrets.TEMPODROID_KEYSTORE_PASSWORD }}
          TEMPODROID_KEY_ALIAS: ${{ secrets.TEMPODROID_KEY_ALIAS }}
          TEMPODROID_KEY_PASSWORD: ${{ secrets.TEMPODROID_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:test :app:lintRelease :app:bundleRelease --stacktrace

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/bundle/release/app-release.aab
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Preserve production R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
